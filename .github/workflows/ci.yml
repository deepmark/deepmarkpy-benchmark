name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[metrics]" pytest

      - name: Run tests
        run: pytest tests -q

  slim-install:
    name: Slim Install Guard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package without extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify no torch and packaged config
        run: |
          python - <<'PY'
          from importlib.resources import files
          from deepmarkpy.plugin_manager import PluginManager
          from deepmarkpy.plugins.attacks.gaussian_noise.attack import GaussianNoiseAttack

          assert files("deepmarkpy.plugins.attacks.gaussian_noise").joinpath("config.json").is_file()
          assert GaussianNoiseAttack() is not None
          attacks = PluginManager().get_attacks()
          expected_remote = {
              "DescriptAudioCodecAttack",
              "DiffusionAttack",
              "EncodecAttack",
              "NeuralVocoderAttack",
              "SpeechEnhancement1Attack",
              "SpeechEnhancement2Attack",
              "SpeechTokenizationAttack",
              "VAEAttack",
          }
          assert expected_remote <= attacks.keys()
          PY
          ! python -m pip list | grep -i '^torch\b'

      - name: CLI help
        run: deepmark-benchmark --help

  ai-dependency-resolution:
    name: Isolated AI Dependency Resolution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Resolve modern AI environments
        run: |
          for extra in vae diffusion neural-vocoder speech-enhancement-1 encodec dac; do
            uv pip compile pyproject.toml \
              --python-version 3.11 \
              --extra "$extra" \
              --constraint constraints/ai-modern.txt \
              --output-file "/tmp/${extra}.txt" \
              --quiet
          done

      - name: Resolve isolated compatibility environments
        run: |
          uv pip compile pyproject.toml \
            --python-version 3.11 \
            --extra speech-tokenization \
            --output-file /tmp/speech-tokenization.txt \
            --quiet
          uv pip compile pyproject.toml \
            --python-version 3.11 \
            --extra speech-enhancement-2 \
            --constraint constraints/clearvoice.txt \
            --output-file /tmp/speech-enhancement-2.txt \
            --quiet
