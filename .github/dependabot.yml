# Dependabot version and security updates.
# Security fixes arrive as one grouped PR per ecosystem as soon as an advisory
# is published; routine minor/patch bumps are grouped into one weekly PR.
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/src/deepmarkpy/plugins/attacks/descript_audio_codec"
      - "/src/deepmarkpy/plugins/attacks/diffusion"
      - "/src/deepmarkpy/plugins/attacks/encodec"
      - "/src/deepmarkpy/plugins/attacks/network_transmission"
      - "/src/deepmarkpy/plugins/attacks/neural_vocoder"
      - "/src/deepmarkpy/plugins/attacks/opus_codec"
      - "/src/deepmarkpy/plugins/attacks/speech_enhancement_1"
      - "/src/deepmarkpy/plugins/attacks/speech_enhancement_2"
      - "/src/deepmarkpy/plugins/attacks/speech_tokenization"
      - "/src/deepmarkpy/plugins/attacks/vae"
      - "/src/deepmarkpy/plugins/models/audio_seal"
      - "/src/deepmarkpy/plugins/models/aware"
      - "/src/deepmarkpy/plugins/models/perth"
      - "/src/deepmarkpy/plugins/models/silent_cipher"
      - "/src/deepmarkpy/plugins/models/timbrewm"
      - "/src/deepmarkpy/plugins/models/wavmark"
      - "/src/deepmarkpy/services/nisqa"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades need deliberate migration; security fixes are unaffected.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # The Python base stays on a minor version torch publishes wheels for (python:3.14 broke every image on
      # 16 Oct 2026): move it by hand, together with torch, after building every image.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/src/deepmarkpy/plugins/attacks/descript_audio_codec"
      - "/src/deepmarkpy/plugins/attacks/diffusion"
      - "/src/deepmarkpy/plugins/attacks/encodec"
      - "/src/deepmarkpy/plugins/attacks/network_transmission"
      - "/src/deepmarkpy/plugins/attacks/neural_vocoder"
      - "/src/deepmarkpy/plugins/attacks/opus_codec"
      - "/src/deepmarkpy/plugins/attacks/speech_enhancement_1"
      - "/src/deepmarkpy/plugins/attacks/speech_enhancement_2"
      - "/src/deepmarkpy/plugins/attacks/vae"
      - "/src/deepmarkpy/plugins/models/audio_seal"
      - "/src/deepmarkpy/plugins/models/aware"
      - "/src/deepmarkpy/plugins/models/perth"
      - "/src/deepmarkpy/plugins/models/silent_cipher"
      - "/src/deepmarkpy/plugins/models/timbrewm"
      - "/src/deepmarkpy/plugins/models/wavmark"
      - "/src/deepmarkpy/services/nisqa"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades need deliberate migration; security fixes are unaffected.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # torch and torchaudio are pinned as a pair matching each Dockerfile's torch==X+variant install, so a
      # bump in one file breaks the build (torch 2.14.1 beside torchaudio 2.7.1 on 16 Oct 2026): move them by
      # hand, in every file at once, after building every image.
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      - dependency-name: "torchvision"
  - package-ecosystem: "pip"
    # Own block so its ignores do not affect other plugins. xcodec2 0.1.3 only
    # works with torch/torchaudio 2.4.1 and transformers 4.44.x: torch 2.8 with
    # transformers 4.57 crashes, and transformers 5 cannot load the model.
    directories:
      - "/src/deepmarkpy/plugins/attacks/speech_tokenization"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      security:
        applies-to: "security-updates"
        patterns: ["*"]
      minor-and-patch:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Major upgrades need deliberate migration; security fixes are unaffected.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Move only together with an xcodec2 upgrade, verified against v2.0.0 output.
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      - dependency-name: "torchao"
      - dependency-name: "transformers"
      - dependency-name: "tokenizers"
      - dependency-name: "huggingface-hub"
