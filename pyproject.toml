[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepmarkpy"
dynamic = ["version"]
description = "DeepMark audio watermark benchmark and attack plugin framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "DeepMark" }
]
dependencies = [
  "numpy>=1.24.3,<3",
  "scipy>=1.11",
  "soundfile>=0.12",
  "librosa>=0.10.2.post1,<0.12",
  "numba>=0.60,<1",
  "requests>=2.31",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "PyWavelets>=1.6",
]

[project.optional-dependencies]
metrics = [
  "pesq>=0.0.4",
  "pystoi>=0.4.1",
  "visqol-python>=3.4.0",
]
native = [
  "pyrubberband>=0.4",
  "audiocomplib>=0.2.0",
  "pycodec2>=4.0.0",
]
torch-core = [
  "torch>=2.4,<2.8",
  "torchaudio>=2.4,<2.8",
]
torch = [
  "deepmarkpy[torch-core]",
  "transformers>=4.53,<5",
]
encodec = [
  "deepmarkpy[torch-core]",
  "encodec>=0.1.1",
]
dac = [
  "deepmarkpy[torch-core]",
  "descript-audio-codec>=1.0.0",
]
vae = [
  "deepmarkpy[torch-core]",
  "huggingface-hub>=0.23,<1",
]
diffusion = [
  "deepmarkpy[torch-core]",
  "diffusers>=0.34,<0.40",
  "accelerate>=1.1,<2",
]
speech-tokenization = [
  "torch==2.4.1",
  "torchaudio==2.4.1",
  "transformers==4.45.2",
  "xcodec2==0.1.3",
]
neural-vocoder = [
  "deepmarkpy[torch-core]",
  "auraloss>=0.4,<0.5",
  "huggingface-hub>=0.23.4,<1",
  "ninja>=1.11",
  "nnAudio>=0.3.3,<0.4",
  "tensorboard>=2.17,<3",
]
speech-enhancement-1 = [
  "deepmarkpy[torch-core]",
  "speechbrain>=1.0,<2",
]
speech-enhancement-2 = [
  "numpy>=1.24.3,<2",
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "clearvoice==0.1.2",
]
models = [
  "deepmarkpy[torch]",
  "resemble-perth>=1.0.1",
]
server = [
  "fastapi>=0.115",
  "uvicorn>=0.35",
  "pydantic>=2.9,<3",
]
dev = [
  "deepmarkpy[metrics,native,server]",
  "pytest>=8",
]

[project.scripts]
deepmark-benchmark = "deepmarkpy.cli:main"

[tool.setuptools.dynamic]
version = { attr = "deepmarkpy.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deepmarkpy = ["**/*.json"]

[tool.uv]
conflicts = [
  [
    { extra = "vae" },
    { extra = "diffusion" },
    { extra = "encodec" },
    { extra = "dac" },
    { extra = "speech-tokenization" },
    { extra = "neural-vocoder" },
    { extra = "speech-enhancement-1" },
    { extra = "speech-enhancement-2" },
    { extra = "torch" },
    { extra = "models" },
    { extra = "native" },
    { extra = "dev" },
  ],
]
